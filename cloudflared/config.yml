# Ingress for the dedicated iwantajob-prod Cloudflare tunnel.
# TUNNEL_ID is filled in when the tunnel is created (see DEPLOY.md).
# credentials.json is generated by `cloudflared tunnel create` and must
# never be committed.

tunnel: a8b6e68a-0307-457d-a518-70ef4391b5ab
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: iwantajob.aryansingh.space
    service: http://frontend:3999
  - service: http_status:404
