<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellfound Scraper Test Portal</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #238636;
      --accent-hover: #2ea043;
      --link: #58a6ff;
      --badge-bg: #21262d;
      --badge-border: #363b42;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; line-height: 1.5; }
    .container { max-width: 1080px; margin: 0 auto; }
    header { margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 24px; color: #fff; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 10px; height: 10px; background: #e02424; border-radius: 50%; display: inline-block; }
    .nav-links { display: flex; gap: 14px; align-items: center; }
    .nav-link { color: var(--link); font-size: 13px; text-decoration: none; }
    .nav-link:hover { text-decoration: underline; }
    
    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 24px; }
    .grid-row-1 { display: grid; grid-template-columns: 2fr 1.5fr auto; gap: 16px; align-items: flex-end; margin-bottom: 16px; }
    .grid-row-2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-items: flex-end; }
    @media (max-width: 768px) {
      .grid-row-1, .grid-row-2 { grid-template-columns: 1fr; }
    }
    
    label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    select { cursor: pointer; }
    input:focus, select:focus { border-color: var(--link); }
    
    button.btn-primary {
      padding: 10px 24px;
      background: #e02424;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 42px;
    }
    button.btn-primary:hover { background: #c81e1e; }
    button.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .pill-group { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .pill-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .pill {
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--text);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
    }
    .pill:hover { border-color: var(--link); color: var(--link); }
    
    .summary-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 14px; color: var(--text-muted); }
    .jobs-list { display: flex; flex-direction: column; gap: 12px; }
    
    .job-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      transition: border-color 0.2s;
    }
    .job-card:hover { border-color: #58a6ff66; }
    .job-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .job-title { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .job-company { font-size: 14px; color: #58a6ff; font-weight: 500; display: flex; align-items: center; gap: 8px; }
    .company-logo { width: 22px; height: 22px; border-radius: 4px; object-fit: cover; background: #30363d; }
    .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .badge {
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--text);
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .badge.salary { color: #56d364; border-color: #238636; }
    .badge.remote { color: #f0883e; border-color: #9e6a03; }
    .badge.exp { color: #d2a8ff; border-color: #8957e5; }
    .badge.fresh { color: #3fb950; border-color: #238636; font-weight: bold; }
    .badge.stale { color: #8b949e; border-color: #30363d; }
    
    .job-desc {
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-muted);
      max-height: 80px;
      overflow: hidden;
      position: relative;
    }
    .job-desc.expanded { max-height: none; }
    .desc-toggle { color: var(--link); font-size: 12px; cursor: pointer; margin-top: 6px; display: inline-block; }
    
    .job-actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
    .btn-apply {
      background: #e02424;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      display: inline-block;
    }
    .btn-apply:hover { background: #c81e1e; }
    
    .btn-secondary {
      background: var(--badge-bg);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 6px;
      display: inline-block;
    }
    .btn-secondary:hover { border-color: var(--link); color: #fff; }
    
    .loader {
      border: 3px solid #f3f3f320;
      border-top: 3px solid #e02424;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 1s linear infinite;
      display: inline-block;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 48px 0; color: var(--text-muted); }
    .error-msg { background: #ffebe9; color: #cf222e; padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><span class="status-dot"></span> Wellfound Scraper Portal</h1>
      <div class="nav-links">
        <a href="/" class="nav-link">&larr; Indeed Portal</a>
        <span style="font-size: 12px; color: var(--text-muted);">Apollo SSR Engine</span>
      </div>
    </header>

    <div id="errorAlert" class="error-msg"></div>

    <div class="panel">
      <!-- Primary Inputs -->
      <div class="grid-row-1">
        <div>
          <label for="roleInput">Role Slug / Keyword</label>
          <input type="text" id="roleInput" value="ai-engineer" placeholder="e.g. ai-engineer, backend-engineer, sdet">
        </div>
        <div>
          <label for="locInput">Location Slug / City</label>
          <input type="text" id="locInput" value="india" placeholder="e.g. india, bengaluru, pune, remote">
        </div>
        <div>
          <button id="searchBtn" class="btn-primary" onclick="triggerSearch()">
            <span id="btnSpinner" style="display: none;" class="loader"></span>
            <span id="btnText">Search Wellfound</span>
          </button>
        </div>
      </div>

      <!-- Knobs Row: Page, Max Age, Limit -->
      <div class="grid-row-2">
        <div>
          <label for="pageInput">Page Number</label>
          <input type="number" id="pageInput" value="1" min="1" max="50">
        </div>
        <div>
          <label for="ageSelect">Max Listing Age</label>
          <select id="ageSelect">
            <option value="" selected>Any Age (All Live Roles)</option>
            <option value="3">Past 3 Days</option>
            <option value="7">Past 7 Days</option>
            <option value="14">Past 14 Days</option>
            <option value="30">Past 30 Days</option>
          </select>
        </div>
        <div>
          <label for="limitInput">Limit (1-100)</label>
          <input type="number" id="limitInput" value="25" min="1" max="100">
        </div>
      </div>

      <!-- Quick Role Pills -->
      <div class="pill-group">
        <span class="pill-label">Quick Roles:</span>
        <span class="pill" onclick="setRole('ai-engineer')">AI Engineer</span>
        <span class="pill" onclick="setRole('software-engineer')">Software Engineer</span>
        <span class="pill" onclick="setRole('backend-engineer')">Backend Engineer</span>
        <span class="pill" onclick="setRole('full-stack-engineer')">Full Stack</span>
        <span class="pill" onclick="setRole('qa-engineer')">QA Engineer</span>
        <span class="pill" onclick="setRole('data-scientist')">Data Scientist</span>
      </div>

      <!-- Quick Location Pills -->
      <div class="pill-group" style="margin-top: 8px;">
        <span class="pill-label">Quick Locations:</span>
        <span class="pill" onclick="setLocation('india')">All India</span>
        <span class="pill" onclick="setLocation('bengaluru')">Bengaluru</span>
        <span class="pill" onclick="setLocation('pune')">Pune</span>
        <span class="pill" onclick="setLocation('mumbai')">Mumbai</span>
        <span class="pill" onclick="setLocation('remote')">Remote</span>
      </div>
    </div>

    <div class="summary-bar">
      <div id="resultsCount">No search run yet</div>
      <div id="fetchTime"></div>
    </div>

    <div id="jobsContainer" class="jobs-list">
      <div class="empty-state">
        Configure your search knobs above and click <b>Search Wellfound</b>.
      </div>
    </div>
  </div>

  <script>
    function setRole(role) {
      document.getElementById('roleInput').value = role;
    }
    function setLocation(loc) {
      document.getElementById('locInput').value = loc;
    }

    async function triggerSearch() {
      const role = document.getElementById('roleInput').value.trim();
      const location = document.getElementById('locInput').value.trim();
      const page = parseInt(document.getElementById('pageInput').value) || 1;
      const ageVal = document.getElementById('ageSelect').value;
      const limit = parseInt(document.getElementById('limitInput').value) || 25;

      const searchBtn = document.getElementById('searchBtn');
      const btnSpinner = document.getElementById('btnSpinner');
      const btnText = document.getElementById('btnText');
      const errorAlert = document.getElementById('errorAlert');
      const jobsContainer = document.getElementById('jobsContainer');
      const resultsCount = document.getElementById('resultsCount');
      const fetchTime = document.getElementById('fetchTime');

      errorAlert.style.display = 'none';
      searchBtn.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.innerText = 'Extracting...';
      resultsCount.innerText = `Fetching Wellfound SSR Landing Page (/role/l/${role}/${location}?page=${page})...`;
      fetchTime.innerText = '';

      const startTime = performance.now();

      try {
        const queryParams = new URLSearchParams({
          role,
          location,
          page: page.toString(),
          limit: limit.toString(),
        });
        if (ageVal) {
          queryParams.append('max_age_days', ageVal);
        }

        const res = await fetch(`/api/scrape/wellfound?${queryParams.toString()}`);
        if (!res.ok) {
          const errData = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(errData.detail || `Server returned HTTP ${res.status}`);
        }
        const jobs = await res.json();
        const duration = ((performance.now() - startTime) / 1000).toFixed(2);
        
        resultsCount.innerText = `Found ${jobs.length} Wellfound roles for "${role}" in "${location}" (page ${page})`;
        fetchTime.innerText = `Extracted in ${duration}s`;

        if (jobs.length === 0) {
          jobsContainer.innerHTML = '<div class="empty-state">No jobs found matching your criteria. Try changing role or clearing max age.</div>';
          return;
        }

        const now = new Date();

        jobsContainer.innerHTML = jobs.map((job, idx) => {
          let dateStr = 'Recently';
          let ageBadgeClass = '';
          if (job.posted_at) {
            const postedDate = new Date(job.posted_at);
            const daysDiff = Math.floor((now - postedDate) / (1000 * 60 * 60 * 24));
            if (daysDiff <= 3) {
              dateStr = `${daysDiff === 0 ? 'Today' : daysDiff + 'd ago'} (Fresh)`;
              ageBadgeClass = 'fresh';
            } else if (daysDiff <= 14) {
              dateStr = `${daysDiff}d ago`;
            } else {
              dateStr = `${daysDiff}d ago (Stale)`;
              ageBadgeClass = 'stale';
            }
          }

          const salaryBadge = job.salary_raw ? `<span class="badge salary">💰 ${escapeHtml(job.salary_raw)}</span>` : '';
          const remoteBadge = job.is_remote ? `<span class="badge remote">🌐 Remote</span>` : '';
          const cityBadge = job.city ? `<span class="badge">📍 ${job.city.toUpperCase()}</span>` : '';
          
          let expBadge = '';
          if (job.experience_min_years !== null && job.experience_min_years !== undefined) {
            const expMaxStr = job.experience_max_years ? `–${job.experience_max_years}` : '+';
            expBadge = `<span class="badge exp">🎯 ${job.experience_min_years}${expMaxStr} yrs</span>`;
          }

          const logoImg = job.company_logo_url ? `<img src="${escapeHtml(job.company_logo_url)}" class="company-logo" alt="logo" onerror="this.style.display='none'">` : '';

          return `
            <div class="job-card">
              <div class="job-header">
                <div>
                  <div class="job-title">${escapeHtml(job.title)}</div>
                  <div class="job-company">
                    ${logoImg}
                    <span>${escapeHtml(job.company_name)}</span>
                    <span style="color: var(--text-muted); font-size: 13px;">&bull; ${escapeHtml(job.location_raw)}</span>
                  </div>
                  <div class="badges">
                    <span class="badge ${ageBadgeClass}">📅 ${dateStr}</span>
                    ${cityBadge}
                    ${remoteBadge}
                    ${expBadge}
                    ${salaryBadge}
                  </div>
                </div>
              </div>
              <div class="job-desc" id="desc-${idx}">
                ${escapeHtml(job.description_text || 'No description preview available.')}
              </div>
              ${job.description_text && job.description_text.length > 200 ? `<span class="desc-toggle" onclick="toggleDesc(${idx})">Show more</span>` : ''}
              <div class="job-actions">
                <a href="${job.url}" target="_blank" rel="noopener noreferrer" class="btn-apply">View on Wellfound &rarr;</a>
                ${job.company_website ? `<a href="${job.company_website}" target="_blank" rel="noopener noreferrer" class="btn-secondary">Company Profile</a>` : ''}
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        errorAlert.innerText = `Error: ${err.message}`;
        errorAlert.style.display = 'block';
        resultsCount.innerText = 'Extraction failed.';
      } finally {
        searchBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.innerText = 'Search Wellfound';
      }
    }

    function toggleDesc(idx) {
      const descEl = document.getElementById(`desc-${idx}`);
      const btn = event.target;
      if (descEl.classList.contains('expanded')) {
        descEl.classList.remove('expanded');
        btn.innerText = 'Show more';
      } else {
        descEl.classList.add('expanded');
        btn.innerText = 'Show less';
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
