[project]
name = "job-portal-backend"
version = "0.1.0"
description = "Job Discovery & Scraping Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "curl-cffi>=0.6.2",
    "beautifulsoup4>=4.12.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "mcp>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
